[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "braindecode-kernels"
version = "0.2.1"
description = "Backend-portable Braindecode-oriented torch ops (CUDA, TPU/XLA, Gaudi/HPU, CPU) built from composed pure-torch operations."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Bruno Aristimunha" },
]
requires-python = ">=3.9"
keywords = ["braindecode", "eeg", "pytorch", "fft", "hilbert"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest", "scipy", "numpy"]

[tool.setuptools.packages.find]
include = ["braindecode_kernels*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
